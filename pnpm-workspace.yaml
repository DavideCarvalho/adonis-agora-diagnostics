packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets. Todos estes ja rodavam
# sob o pnpm 9 (biome/swc/esbuild/better-sqlite3/sharp compilam ou baixam binario), entao
# liberar preserva o comportamento; nao e permissao nova.
allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  esbuild: true
# Every other peer of @adonis-agora/diagnostics is also a devDependency, so this only stops pnpm
# from installing the optional `@adonis-agora/durable` peer, which the tests replace with a fake.
autoInstallPeers: false

# Intent (`intent validate`) typechecks the skill examples from the repo root, so hoist the
# packages they import (devDependencies of packages/core) to the root node_modules: the examples
# load `@adonisjs/core` services against the same copy the library uses.
# Install-time only: no published package changes.
publicHoistPattern:
  - "@adonisjs/core"
